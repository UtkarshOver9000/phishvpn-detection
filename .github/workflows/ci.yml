name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=term-missing

      - name: Train + evaluate on synthetic data (smoke test)
        run: |
          python -m phishvpn.synthetic_data --out /tmp/sessions.csv --rows 5000 --seed 7
          python -m phishvpn.train --data /tmp/sessions.csv --model-out /tmp/model.joblib --metrics-out /tmp/metrics.json --seed 7
          cat /tmp/metrics.json
        env:
          PYTHONPATH: src
