[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phishurl"
version = "2.0.0"
description = "Phishing-domain detection trained on real data (PhiUSIIL + Tranco) and tested on the live OpenPhish feed"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn==1.9.1",
  "joblib>=1.3",
  "tldextract==5.4.0",
]

[project.optional-dependencies]
train = ["matplotlib>=3.8"]
dev = ["matplotlib>=3.8", "pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phishurl = ["artifacts/*", "dashboard/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
